[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "heliosoil"
version = "0.4.0"
description = "Soiling Model and Cleaning Optimization for Solar Power Plants"
authors = [
    { name = "Giovanni Picotti" },
    { name = "Michael E. Cholette" },
    { name = "Cody B. Anderson" }
]
readme = "README.md"
requires-python = ">=3.9"
license = { file = "LICENSE" }
keywords = ["solar", "csp", "soiling", "heliostat", "cleaning", "optimization"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering",
    "Topic :: Scientific/Engineering :: Physics",
]

# Core dependencies
dependencies = [
    "numpy>=1.20.0",
    "pandas>=1.3.0",
    "matplotlib>=3.5.0",
    "scipy>=1.7.0",
    "miepython>=2.5.0",
    "openpyxl>=3.0.0",
    "pysolar>=0.10",
    "tqdm>=4.60.0",
    "numba>=0.56.0",
    "numdifftools>=0.9.40",
    "windrose>=1.6.0",
    "pytz>=2021.1",
    "scikit-learn>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "ipykernel>=6.31.0",
    "nbconvert>=7.17.1",
    "nbstripout>=0.8.2",
    "pre-commit>=4.3.0",
    "pytest>=8.4.2",
    "ruff>=0.16.5",
]
docs = [
    "sphinx",
    "sphinx-rtd-theme",
]

[project.urls]
Homepage = "https://github.com/cholette/HelioSoil"
Repository = "https://github.com/cholette/HelioSoil"
Documentation = "https://github.com/cholette/HelioSoil#readme"
Issues = "https://github.com/cholette/HelioSoil/issues"

# Package discovery configuration
[tool.setuptools.packages.find]
where = ["src"]
include = ["heliosoil*"]
exclude = ["tests*", "docs*"]

# Include additional files in the package
[tool.setuptools.package-data]
heliosoil = ["*.txt", "*.md"]

# Ruff configuration
[tool.ruff]
line-length = 150
extend-exclude = [
    "data",
    "results",
    "examples/",
    "docs",
    "heliosoil.egg-info",
    "copylot.py",
]

[tool.ruff.format]
skip-magic-trailing-comma = true # Ruff's default is to add a trailing comma to multi-line collections, but this can be annoying when editing code. This option disables that behavior.
quote-style = "double" # Ruff's default is to use single quotes for strings, but this project prefers double quotes.
indent-style = "space" # Ruff's default is to use tabs for indentation, but this project prefers spaces.

[tool.ruff.lint]
# Ruff's historical default set; widen later if you want flake8-style coverage.
select = ["E4", "E7", "E9", "F"]
ignore = ["E501", "E731", "E402"]  # Ignore line length, lambda assignment, and module level import not at top of file.

[tool.ruff.lint.isort]
split-on-trailing-comma = false # Ruff's default is to split imports on trailing commas, but this project prefers to keep imports on a single line when possible.

# Development tools configuration
[tool.nbstripout]
keep_output = false
keep_count = false

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
